<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaseVault — симулятор открытия кейсов CS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e14;--panel:#141824;--panel2:#1a2030;--line:#262d42;--text:#e8ecf6;--mute:#8b94ad;
  --accent:#ff6a2b;--accent2:#ffb02b;--green:#3ddc84;--red:#ff5470;
  --mil:#4b69ff;--res:#8847ff;--cls:#d32ee6;--cov:#eb4b4b;--rare:#ffd700;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 70% -10%,#1d2340 0%,transparent 60%),var(--bg);color:var(--text);font-family:Rubik,system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(12,14,20,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;user-select:none;cursor:default}
.logo i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:7px;border:2px solid #0c0e14;border-radius:3px}
.logo b{color:var(--accent)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:transparent;color:var(--mute);padding:9px 14px;border-radius:9px;font-weight:500}
nav button.on,nav button:hover{background:var(--panel2);color:var(--text)}
.wallet{display:flex;align-items:center;gap:10px}
.bal{background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-weight:600;color:var(--green);font-variant-numeric:tabular-nums}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0c00;font-weight:600;padding:10px 18px;border-radius:10px;transition:.15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.green{background:linear-gradient(135deg,#22c55e,#3ddc84);color:#032}
main{max-width:1240px;margin:0 auto;padding:22px 18px 80px}
.hero{border:1px solid var(--line);border-radius:18px;padding:30px;background:linear-gradient(120deg,#1b1f35,#2a1a14 120%);margin-bottom:26px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.hero h1{font-size:30px;line-height:1.2;margin-bottom:8px}
.hero p{color:var(--mute);max-width:560px;line-height:1.5}
.pill{display:inline-block;background:#ff6a2b22;color:var(--accent2);border:1px solid #ff6a2b55;padding:3px 10px;border-radius:99px;font-size:12px;margin-bottom:10px}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:#0c0e1488;border:1px solid var(--line);padding:12px 18px;border-radius:12px;min-width:120px}
.stat small{color:var(--mute);display:block;font-size:12px}
.stat b{font-size:20px}
h2{font-size:20px;margin:6px 0 14px}
.sec{margin-top:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card .tag{position:absolute;top:12px;left:12px;font-size:11px;padding:3px 8px;border-radius:99px;background:#0c0e14cc;border:1px solid var(--line);color:var(--accent2)}
.crate{height:140px;display:flex;align-items:center;justify-content:center}
.crate svg{filter:drop-shadow(0 8px 18px var(--glow,#ff6a2b66));transition:.2s}
.card:hover .crate svg{transform:scale(1.07) rotate(-2deg)}
.card h3{font-size:17px;margin:4px 0}
.card .meta{color:var(--mute);font-size:13px;display:flex;justify-content:space-between}
.card .price{margin-top:10px;font-weight:700;color:var(--accent2);font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.card .price small{font-weight:400;font-size:12px;color:var(--mute)}
.back{background:none;color:var(--mute);margin-bottom:12px;padding:6px 0}
.back:hover{color:var(--text)}
.cv-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.cv-head .crate{width:200px;height:170px}
.cv-head h1{font-size:28px}
.cv-head p{color:var(--mute);margin:6px 0 14px;max-width:560px;line-height:1.5}
.opens{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chk{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}
.roulette{position:relative;height:200px;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;margin:6px 0 18px}
.roulette:before,.roulette:after{content:"";position:absolute;top:0;bottom:0;width:90px;z-index:2;pointer-events:none}
.roulette:before{left:0;background:linear-gradient(90deg,var(--panel),transparent)}
.roulette:after{right:0;background:linear-gradient(-90deg,var(--panel),transparent)}
.needle{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--accent2);z-index:3;box-shadow:0 0 14px var(--accent2);transform:translateX(-50%)}
.needle:before{content:"";position:absolute;top:0;left:-7px;border:8px solid transparent;border-top-color:var(--accent2)}
.track{position:absolute;top:16px;left:0;display:flex;gap:8px;will-change:transform}
.it{width:140px;height:166px;flex:none;border-radius:12px;background:var(--panel2);border:1px solid var(--line);border-bottom:4px solid var(--c);padding:9px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.it:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,var(--c),transparent 68%);opacity:.24}
.it .w{font-size:11px;color:var(--mute);position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-weight:600;font-size:13px;line-height:1.2;position:relative}
.it .p{font-size:13px;color:var(--accent2);position:relative;font-weight:600}
.it .ico{position:relative;height:56px;display:flex;align-items:center;justify-content:center}
.it .ico svg{width:104px;height:44px;filter:drop-shadow(0 3px 4px #000a)}
.mil{--c:var(--mil)}.res{--c:var(--res)}.cls{--c:var(--cls)}.cov{--c:var(--cov)}.rare{--c:var(--rare)}
.lbl{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.odds{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin:6px 0 16px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.items .it{width:auto}
.items .it.est .p:after{content:" ~";color:var(--mute)}
.it.pick{outline:2px solid var(--green);outline-offset:-2px}
.it.click{cursor:pointer;transition:.12s}.it.click:hover{transform:translateY(-3px)}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:760px;width:100%;max-height:88vh;overflow:auto}
.box h3{margin-bottom:12px}
.won{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0 16px}
.won .it{width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.inv-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.inv .it .btn{position:relative;margin-top:4px}
.empty{color:var(--mute);padding:40px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:9px;font:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{color:var(--mute);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:58px;background:var(--bg)}
.tbl td{padding:9px 10px;border-bottom:1px solid #1d2335}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.n{text-align:right}
.tbl td .mini{display:inline-block;width:46px;height:20px;vertical-align:middle;margin-right:8px}
.tbl td .mini svg{width:100%;height:100%}
.note{color:var(--mute);font-size:13px;line-height:1.55;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:80;transition:.3s;opacity:0;max-width:92vw}
.toast.on{transform:translateX(-50%);opacity:1}
.about p{color:var(--mute);line-height:1.65;margin-bottom:12px;max-width:760px}
.about h3{margin:18px 0 6px}
/* апгрейдер */
.up{display:grid;grid-template-columns:1fr 300px 1fr;gap:16px;align-items:start}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.pn h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.pn h3 span{color:var(--accent2);font-weight:600}
.scroll{max-height:560px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;padding-right:4px}
.scroll .it{width:auto;height:150px;padding:7px}
.scroll .it .ico svg{width:84px;height:36px}
.scroll .it .s{font-size:11.5px}
.wheel{text-align:center}
.wheel svg{width:100%;max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--panel2);border:1px solid var(--line);padding:5px 10px;border-radius:99px;font-size:12px;color:var(--mute)}
.chip.on{color:#1a0c00;background:var(--accent2);border-color:var(--accent2)}
.adm label{display:flex;align-items:center;gap:10px;margin:12px 0 6px;font-weight:500}
.adm .hint{color:var(--mute);font-size:12.5px;line-height:1.5;margin-bottom:6px}
.adm input[type=number],.adm input[type=password]{width:140px}
.adm .grp{border-top:1px solid var(--line);padding-top:6px;margin-top:10px}
@media(max-width:980px){.up{grid-template-columns:1fr}.wheel{order:-1}}
.crate img.face{height:92%;aspect-ratio:1;object-fit:cover;border-radius:20px;border:2px solid #ffffff40;box-shadow:0 8px 20px var(--glow,#ff6a2b66);transition:.2s}
.card:hover .crate img.face{transform:scale(1.06) rotate(-2deg)}
nav button{white-space:nowrap}.bal{white-space:nowrap}.wallet{flex:none}
.live{display:flex;gap:12px;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
.onl{flex:none;display:flex;flex-direction:column;justify-content:center;padding:0 14px 0 6px;border-right:1px solid var(--line);min-width:96px}
.onl b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}.onl small{color:var(--mute);font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.35}}
@keyframes slin{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.feed{display:flex;gap:8px;overflow:hidden;flex:1;min-width:0}
.fd{flex:none;width:156px;background:var(--panel2);border:1px solid var(--line);border-bottom:3px solid var(--c);border-radius:10px;padding:6px 8px;position:relative;overflow:hidden}
.fd:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,var(--c),transparent 70%);opacity:.2}
.fd.new{animation:slin .5s ease}
.fd *{position:relative}.fd .fi svg{width:100%;height:34px}
.fd b{display:block;font-size:11px;color:var(--mute);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd span{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd em{font-style:normal;font-size:12px;color:var(--accent2);font-weight:600}
@media(max-width:640px){
 .hero h1{font-size:23px}
 .bar{padding:8px 12px;gap:8px 10px}
 .logo{font-size:19px}
 .wallet{margin-left:auto;gap:8px}
 .bal{padding:7px 10px;font-size:14px}
 nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
 nav::-webkit-scrollbar{display:none}
 nav button{flex:none;padding:8px 12px}
 .cv-head .crate{width:140px}
 .onl{min-width:84px;padding-right:10px}
}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo" id="logo"><i></i>Case<b>Vault</b></div>
  <nav id="nav">
    <button data-v="cases" class="on">Кейсы</button>
    <button data-v="up">Апгрейд</button>
    <button data-v="inv">Инвентарь <span id="invCount"></span></button>
  </nav>
  <div class="wallet">
    <div class="bal" id="bal">$0.00</div>
    <button class="btn sm" id="depBtn">+ Пополнить</button>
  </div>
</div></header>
<main id="app"></main>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

  if(/Knife|Daggers|Karambit|Bayonet/.test(n))return"knife";
  const w=n.split(" | ")[0];
  if(/^(AWP|SSG 08|SCAR-20|G3SG1)$/.test(w))return"sniper";
  if(/^(AK-47|M4A4|M4A1-S|FAMAS|Galil AR|SG 553|AUG)$/.test(w))return"rifle";
  if(/^(MP7|MP9|UMP-45|P90|PP-Bizon|MAC-10|MP5-SD)$/.test(w))return"smg";
  if(/^(Nova|Sawed-Off|MAG-7|XM1014)$/.test(w))return"shotgun";
  if(/^(M249|Negev)$/.test(w))return"mg";
  if(/^Zeus/.test(w))return"zeus";
  return"pistol";
}

/* ---- математика цен ---- */
function evItem(it){
  const span=it.hi-it.lo;let e=0;
  WB.forEach(([a,b],w)=>{const pr=Math.max(0,Math.min(b,it.hi)-Math.max(a,it.lo))/span;e+=pr*priceOf(it,w,false)});
  return e*(it.r==="rare"?1:1.15);
}
function normOdds(c){
  const have=RAR.filter(r=>c.odds[r]>0&&c.items.some(i=>i.r===r));
  const tot=have.reduce((a,r)=>a+c.odds[r],0);
  const o={};have.forEach(r=>o[r]=c.odds[r]/tot*100);return o;
}
function caseEV(c){
  const o=normOdds(c);let ev=0;
  for(const r in o){const pool=c.items.filter(i=>i.r===r);ev+=o[r]/100*pool.reduce((a,i)=>a+evItem(i),0)/pool.length}
  return ev;
}
[...SPECIAL,...CUSTOM].forEach(c=>{c.nodds=normOdds(c);c.kind=SPECIAL.includes(c)?"Особый":"Тематический";c.price=c.fixed||Math.max(.49,Math.round(caseEV(c)*1.1*100)/100)});

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const HUES=[[/Fade/,320,35,75],[/Sapphire/,212,228,85],[/Ruby|Slaughter|Crimson|Red Racer|Ultra Violent/,355,8,75],[/Blue Steel|Cobalt|Frosty|Wave Chaser|Cloud Chaser/,208,225,60],[/Forest|Boreal|Safari|Garden|Lime/,105,70,45],[/Scorched|Stained|Rust|Chesterfield|Case Hardened/,28,215,55],[/Vanilla|Printstream|Silent Shot/,0,0,0],[/Sunburst|Amberline|Electrum|Fully Tuned|Gambit|Blaze/,45,28,85],[/Night Stripes|Urban|Occult|Blackbook/,260,230,15]];
function skinSVG(n){
  const t=weaponType(n),h=hash(n),R=rng(h);
  let h1=h%360,h2=(h1+40+(h>>8)%80)%360,sat=55+(h>>4)%35;
  for(const [re,a,b,s] of HUES)if(re.test(n)){h1=a;h2=b;sat=s;break}
  const c1=`hsl(${h1} ${sat}% 56%)`,c2=`hsl(${h2} ${sat}% 26%)`;
  const id="k"+(skinSVG.n=(skinSVG.n||0)+1),pat=h%5;
  let ov="";
  if(pat===0)for(let k=0;k<8;k++)ov+=`<rect x="${-20+k*18}" y="-10" width="6" height="80" transform="rotate(28 60 25)" fill="#fff" opacity=".17"/>`;
  else if(pat===1)for(let k=0;k<26;k++)ov+=`<circle cx="${R()*120}" cy="${R()*50}" r="${1+R()*2.2}" fill="#fff" opacity="${.12+R()*.2}"/>`;
  else if(pat===2)for(let k=0;k<9;k++)ov+=`<ellipse cx="${R()*120}" cy="${R()*50}" rx="${6+R()*10}" ry="${3+R()*5}" fill="#000" opacity=".28" transform="rotate(${R()*180} 60 25)"/>`;
  else if(pat===3)ov=`<polygon points="0,50 40,0 62,0 22,50" fill="#fff" opacity=".18"/><polygon points="60,50 100,0 108,0 68,50" fill="#fff" opacity=".12"/>`;
  else for(let k=0;k<7;k++)ov+=`<rect x="-5" y="${k*8}" width="130" height="2.4" fill="#fff" opacity=".15"/>`;
  const p=SIL[t];
  return `<svg viewBox="0 0 120 50" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient><clipPath id="${id}c"><path d="${p}"/></clipPath></defs><g clip-path="url(#${id}c)"><rect width="120" height="50" fill="url(#${id}g)"/>${ov}<rect y="0" width="120" height="6" fill="#fff" opacity=".12"/></g><path d="${p}" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="1.3"/></svg>`;
}

/* ============ ЛОГИКА ============ */
function pickRarity(c){
  let r=Math.random()*100,acc=0;const o=c.nodds;
  for(const k of RAR){if(!o[k])continue;acc+=o[k];if(r<acc)return k}
  return Object.keys(o)[0];
}
function roll(c){
  const rar=pickRarity(c);
  const pool=c.items.filter(i=>i.r===rar);
  const it=pool[Math.floor(Math.random()*pool.length)];
  const f=it.lo+Math.random()*(it.hi-it.lo);
  const w=wearOf(f);
  const stt=it.r!=="rare"&&Math.random()<.1;
  return {uid:st.uid++,n:it.n,r:it.r,case:it.case,w,f:+f.toFixed(4),st:stt,p:priceOf(it,w,stt)};
}
const fakeRoll=c=>{const it=roll(c);st.uid--;it.uid=0;return it};
function drop(c){ // с учётом настройки окупа в админ-панели
  let d=roll(c);const pb=Math.max(+st.admin.payback||0,(c.back||0)*100);
  if(pb>0){
    const th=c.price*pb/100;let k=0;
    while(d.p<th&&k++<500)d=roll(c);
    if(d.p<th){const top=[...c.items].sort((a,b)=>b.fn-a.fn)[0];d={uid:st.uid++,n:top.n,r:top.r,case:top.case,w:0,f:.01,st:false,p:priceOf(top,0,false)}}
  }
  return d;
}

  <div class="odds">${order.map(r=>`<span class="${r}"><i class="lbl"></i>${RN[r]} ${(+c.nodds[r].toFixed(2))}%</span>`).join("")}<span>${c.back?`Минимальный дроп ≥ ${fmt(c.price*c.back)} при цене ${fmt(c.price)}`:`Средний дроп ≈ ${fmt(ev)} при цене ${fmt(c.price)}`}</span></div>
  <h2>Содержимое кейса · ${c.items.length}</h2><div class="items">${sorted.map(i=>itCard({...i,p:priceOf(i,2,false),w:2})).join("")}</div>
  <p class="note">Цена на карточках — для износа Field-Tested. StatTrak™ выпадает с шансом 10% (цена ×2,5). Знак «~» — оценочная цена. Все шансы и цены — для симулятора.</p>`;
  $("#back").onclick=()=>{curCase=null;render()};
  $("#fast").onchange=e=>fast=e.target.checked;
  $$(".opens .btn").forEach(b=>b.onclick=()=>openCase(+b.dataset.n));
  fillIdle();
}
function fillIdle(){
  const tr=$("#track");if(!tr||!curCase)return;
  tr.style.transition="none";tr.style.transform="translateX(0)";
  tr.innerHTML=Array.from({length:14},()=>itCard(fakeRoll(curCase))).join("");
}
function openCase(n){
  if(busy)return;const c=curCase,cost=c.price*n;
  if(st.bal<cost-1e-9){toast("Недостаточно средств. Пополни баланс или продай скины.");return}
  st.bal-=cost;st.spent+=cost;st.opened+=n;
  const drops=Array.from({length:n},()=>drop(c));
  drops.forEach(d=>{st.inv.push(d);pushFeed("Ты",d,c,true)});
  save();head();
  if(n>1||fast){showWin(drops);return}
  busy=true;
  const win=drops[0],WIN=44,total=52;
  const seq=Array.from({length:total},(_,i)=>i===WIN?win:fakeRoll(c));
  const tr=$("#track");tr.style.transition="none";tr.style.transform="translateX(0)";
  tr.innerHTML=seq.map(i=>itCard(i)).join("");
  void tr.offsetWidth;
  const cw=$("#roul").clientWidth,cardW=148,jitter=(Math.random()-.5)*100;
  const x=WIN*cardW+70+jitter-cw/2;
  tr.style.transition="transform 6s cubic-bezier(.08,.6,.12,1)";
  tr.style.transform=`translateX(${-x}px)`;
  setTimeout(()=>{busy=false;showWin(drops)},6300);
}
function showWin(drops){
  const tot=drops.reduce((a,b)=>a+b.p,0);
  const m=$("#modal");
  $("#modalBox").innerHTML=`<h3>${drops.length>1?"Выпало":"Тебе выпало"}</h3>
   <div class="won">${drops.map(d=>itCard(d)).join("")}</div>
   <div class="row"><span style="margin-right:auto;color:var(--mute);align-self:center">Итого: <b style="color:var(--accent2)">${fmt(tot)}</b></span>
   <button class="btn ghost" id="keep">В инвентарь</button><button class="btn" id="sellW">Продать за ${fmt(tot)}</button></div>`;
  m.classList.add("on");
  $("#keep").onclick=()=>{m.classList.remove("on");fillIdle();render()};
  $("#sellW").onclick=()=>{drops.forEach(d=>sellUid(d.uid));save();m.classList.remove("on");fillIdle();render();toast("Продано за "+fmt(tot))};
}
function sellUid(uid){
  const i=st.inv.findIndex(x=>x.uid===uid);if(i<0)return 0;
  const p=st.inv[i].p;st.bal+=p;st.sold+=p;st.inv.splice(i,1);return p;
}

/* ---- инвентарь ---- */
function renderInv(app){
  const val=st.inv.reduce((a,b)=>a+b.p,0);
  app.innerHTML=`<div class="inv-top"><h2 style="margin:0">Инвентарь · ${st.inv.length} предм. на ${fmt(val)}</h2>
   <div class="row"><button class="btn ghost sm" id="reset">Сбросить прогресс</button><button class="btn sm" id="sellAll" ${st.inv.length?"":"disabled"}>Продать всё</button></div></div>
   ${st.inv.length?`<div class="items inv">${[...st.inv].reverse().map(i=>itCard(i,`<button class="btn ghost sm" data-s="${i.uid}">Продать</button>`)).join("")}</div>`:`<div class="empty">Инвентарь пуст. Открой первый кейс!</div>`}
   <p class="note">Продажа идёт по рыночной цене без комиссии.</p>`;
  $$("[data-s]").forEach(b=>b.onclick=e=>{e.stopPropagation();const p=sellUid(+b.dataset.s);save();render();toast("Продано за "+fmt(p))});
  const sa=$("#sellAll");if(sa)sa.onclick=()=>{const t=val;st.inv.forEach(i=>{st.bal+=i.p;st.sold+=i.p});st.inv=[];save();render();toast("Продано за "+fmt(t))};
  $("#reset").onclick=()=>{if(!confirm0())return;const a=st.admin;st=fresh();st.admin=a;UP.sel.clear();UP.target=null;save();render()};
}
let _rc=0;function confirm0(){
  _rc++;setTimeout(()=>_rc=0,2500);
  if(_rc<2){toast("Нажми ещё раз, чтобы сбросить всё до нуля");return false}_rc=0;return true;
}

/* ---- апгрейдер ---- */
const CIRC=2*Math.PI*100;
const upChance=(sum,tp)=>sum>0&&tp>0?Math.min(95,Math.max(.5,sum/tp*95)):0;
function upSum(){let s=0;st.inv.forEach(i=>{if(UP.sel.has(i.uid))s+=i.p});return s}
function renderUp(app){
  [...UP.sel].forEach(u=>{if(!st.inv.some(i=>i.uid===u))UP.sel.delete(u)});
  const sum=upSum(),R=RANGES[UP.range];
  const q=UP.q.toLowerCase();
  let targets=ALL.map(i=>({...i,p:priceOf(i,2,false),w:2}));
  if(sum>0)targets=targets.filter(i=>i.p>=sum*R[1]&&i.p<=sum*R[2]);
  targets=targets.filter(i=>!q||i.n.toLowerCase().includes(q)).sort((a,b)=>a.p-b.p).slice(0,60);
  if(UP.target&&sum>0&&UP.target.p<sum*1.0001&&!targets.some(t=>t.n===UP.target.n))UP.target=null;
  const ch=UP.target?upChance(sum,UP.target.p):0;
  const g=ch/100*CIRC;
  app.innerHTML=`<h2>Апгрейд скинов</h2>
  <div class="up">
   <div class="pn"><h3>Твои скины <span>${UP.sel.size?fmt(sum):"выбери"}</span></h3>
    ${st.inv.length?`<div class="scroll">${[...st.inv].reverse().map(i=>itCard(i,"",`click ${UP.sel.has(i.uid)?"pick":""}" data-u="${i.uid}`)).join("")}</div>`:`<div class="empty">Инвентарь пуст. Открой кейс, чтобы было что апгрейдить.</div>`}</div>
   <div class="pn wheel">
    <svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="100" fill="none" stroke="#262d42" stroke-width="22"/>
     <circle cx="130" cy="130" r="100" fill="none" stroke="#3ddc84" stroke-width="22" stroke-dasharray="${g} ${CIRC}" transform="rotate(-90 130 130)"/>
     <g id="ptr" style="transform-origin:130px 130px"><polygon points="130,28 119,2 141,2" fill="#ffb02b"/><line x1="130" y1="28" x2="130" y2="44" stroke="#ffb02b" stroke-width="3"/></g>
     <text x="130" y="128" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="700" font-size="34" fill="#e8ecf6">${UP.target&&sum?ch.toFixed(ch<10?2:1)+"%":"—"}</text>
     <text x="130" y="152" text-anchor="middle" font-family="Rubik,sans-serif" font-size="13" fill="#8b94ad">шанс успеха</text></svg>
    <div style="margin:6px 0 12px;color:var(--mute);font-size:13px;line-height:1.5">${UP.target&&sum?`Ставка ${fmt(sum)} → ${esc(UP.target.n)} ${fmt(UP.target.p)}<br>Множитель ×${(UP.target.p/sum).toFixed(2)}`:"Выбери свои скины слева и цель справа"}</div>
    <button class="btn" id="go" style="width:100%" ${UP.target&&sum&&!busy?"":"disabled"}>Апгрейд</button></div>
   <div class="pn"><h3>Цель <span>${UP.target?fmt(UP.target.p):""}</span></h3>
    <div class="chips">${RANGES.map((r,k)=>`<button class="chip ${k===UP.range?"on":""}" data-r="${k}">${r[0]}</button>`).join("")}</div>
    <input id="uq" placeholder="Поиск цели…" value="${esc(UP.q)}" style="width:100%;margin-bottom:10px">
    ${sum>0?(targets.length?`<div class="scroll">${targets.map(i=>itCard(i,"",`click ${UP.target&&UP.target.n===i.n?"pick":""}" data-t="${esc(i.n)}`)).join("")}</div>`:`<div class="empty">Нет целей в этом диапазоне</div>`):`<div class="empty">Сначала выбери свои скины</div>`}</div>
  </div>
  <p class="note">Шанс = стоимость ставки ÷ стоимость цели × 95%, максимум 95%. Цена цели — для износа Field-Tested. При проигрыше ставка сгорает, при победе цель попадает в инвентарь.</p>`;
  $$("[data-u]").forEach(el=>el.onclick=()=>{if(busy)return;const u=+el.dataset.u;UP.sel.has(u)?UP.sel.delete(u):UP.sel.add(u);renderUp($("#app"))});
  $$("[data-t]").forEach(el=>el.onclick=()=>{if(busy)return;UP.target=targets.find(t=>t.n===el.dataset.t);renderUp($("#app"))});
  $$("[data-r]").forEach(el=>el.onclick=()=>{if(busy)return;UP.range=+el.dataset.r;renderUp($("#app"))});
  const uq=$("#uq");if(uq)uq.oninput=e=>{UP.q=e.target.value;const pos=e.target.selectionStart;renderUp($("#app"));const n=$("#uq");n.focus();n.setSelectionRange(pos,pos)};
  const go=$("#go");if(go)go.onclick=doUpgrade;
}
function doUpgrade(){
  if(busy)return;const sum=upSum();const t=UP.target;if(!t||!sum)return;
  const ch=upChance(sum,t.p);
  const win=st.admin.upWin||Math.random()*100<ch;
  const arc=ch*3.6;
  const ang=win?arc*(.06+Math.random()*.88):arc+(360-arc)*(.06+Math.random()*.88);
  // применяем результат сразу, чтобы перезагрузка страницы не давала обойти проигрыш
  const lost=st.inv.filter(i=>UP.sel.has(i.uid));
  st.inv=st.inv.filter(i=>!UP.sel.has(i.uid));
  let got=null;
  if(win){got={uid:st.uid++,n:t.n,r:t.r,case:t.case,w:2,f:.25,st:false,p:t.p};st.inv.push(got)}
  st.ups++;UP.sel.clear();if(win)UP.target=null;save();head();
  busy=true;$("#go").disabled=true;
  const ptr=$("#ptr");ptr.style.transition="transform 5.5s cubic-bezier(.12,.7,.1,1)";
  ptr.style.transform=`rotate(${360*6+ang}deg)`;
  setTimeout(()=>{
    busy=false;
    $("#modalBox").innerHTML=win
     ?`<h3 style="color:var(--green)">Апгрейд успешен!</h3><div class="won">${itCard(got)}</div><div class="row"><button class="btn" id="okU">Отлично</button></div>`
     :`<h3 style="color:var(--red)">Не повезло</h3><p style="color:var(--mute);margin-bottom:10px">Ставка ${fmt(sum)} сгорела (шанс был ${ch.toFixed(1)}%).</p><div class="won">${lost.map(i=>itCard(i)).join("")}</div><div class="row"><button class="btn" id="okU">Понятно</button></div>`;
    $("#modal").classList.add("on");
    $("#okU").onclick=()=>{$("#modal").classList.remove("on");render()};
  },5800);
}

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2600)}

/* ============ АДМИН-ПАНЕЛЬ (скрытая) ============ */
function openGate(){
  if(adminOK)return openAdmin();
  $("#modalBox").innerHTML=`<div class="adm"><h3>Служебный доступ</h3><div class="hint">Введи код</div>
   <input type="password" id="code" maxlength="8" inputmode="numeric" autocomplete="off"> <button class="btn sm" id="codeOk">Войти</button></div>`;
  $("#modal").classList.add("on");
  const go=()=>{if($("#code").value==="9999"){adminOK=true;openAdmin()}else{toast("Неверный код");$("#code").value=""}};
  $("#codeOk").onclick=go;$("#code").onkeydown=e=>{if(e.key==="Enter")go()};
  setTimeout(()=>$("#code").focus(),30);
}
function openAdmin(){
  const a=st.admin;
  $("#modalBox").innerHTML=`<div class="adm"><h3>Админ-панель</h3>
   <label><input type="checkbox" id="aUp" ${a.upWin?"checked":""}> 100% заход апгрейда</label>
   <div class="hint">Каждый апгрейд проходит успешно, независимо от показанного шанса.</div>
   <div class="grp"><label>Окуп с кейса, %</label>
   <div class="hint">Минимальная стоимость дропа в процентах от цены кейса. 0 — выключено, 100 — кейс всегда окупается, 300 — всегда выпадает скин в 3 раза дороже кейса.</div>
   <input type="number" id="aPb" min="0" max="1000" step="10" value="${a.payback}"> <button class="btn sm" id="aPbSet">Применить</button>
   <button class="btn ghost sm" data-pb="0">Выкл</button><button class="btn ghost sm" data-pb="100">100%</button><button class="btn ghost sm" data-pb="300">300%</button></div>
   <div class="grp"><label>Выдать деньги</label>
   <input type="number" id="aMoney" min="0" step="100" placeholder="Сумма"> <button class="btn green sm" id="aGive">Выдать</button>
   <button class="btn ghost sm" data-m="1000">+$1 000</button><button class="btn ghost sm" data-m="10000">+$10 000</button><button class="btn ghost sm" data-m="100000">+$100 000</button></div>
   <div class="row" style="margin-top:16px"><button class="btn ghost sm" id="aClose">Закрыть</button></div></div>`;
  $("#modal").classList.add("on");
  $("#aUp").onchange=e=>{st.admin.upWin=e.target.checked;save();toast(e.target.checked?"Апгрейд: 100% успех":"Апгрейд: обычные шансы")};
  const setPb=v=>{v=Math.max(0,Math.min(1000,+v||0));st.admin.payback=v;$("#aPb").value=v;save();toast(v?`Окуп: минимум ${v}% от цены кейса`:"Окуп выключен")};
  $("#aPbSet").onclick=()=>setPb($("#aPb").value);
  $$("[data-pb]").forEach(b=>b.onclick=()=>setPb(b.dataset.pb));
  const give=v=>{v=+v;if(!(v>0))return toast("Введи сумму");st.bal+=v;save();head();toast("Выдано "+fmt(v))};
  $("#aGive").onclick=()=>{give($("#aMoney").value);$("#aMoney").value=""};
  $$("[data-m]").forEach(b=>b.onclick=()=>give(b.dataset.m));
  $("#aClose").onclick=closeModal;
}
function closeModal(){$("#modal").classList.remove("on");if(curCase)fillIdle();render()}
let _lc=0,_lt;
$("#logo").onclick=()=>{_lc++;clearTimeout(_lt);_lt=setTimeout(()=>_lc=0,1500);if(_lc>=5){_lc=0;openGate()}};
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.altKey&&e.code==="KeyA")openGate()});

/* ============ ПОПОЛНЕНИЕ (виртуальное) ============ */
const PROMOS={STOLBNYAK:15,SHLYXA:10},DEP_LIMIT=100;
const localDay=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function depLeft(){const t=localDay();if(!st.dep||st.dep.d!==t)st.dep={d:t,s:0};return Math.max(0,Math.round((DEP_LIMIT-st.dep.s)*100)/100)}
function openDeposit(){
  if(busy)return;
  let promo=null;const left=depLeft();
  $("#modalBox").innerHTML=`<div class="adm"><h3>Пополнение баланса</h3>
   <div class="hint">Симуляция: реальные деньги не списываются. Лимит — $${DEP_LIMIT} в день. Осталось сегодня: <b style="color:var(--accent2)">${fmt(left)}</b></div>
   <label>Сумма, $</label>
   <div class="chips">${[5,10,25,50,100].map(v=>`<button class="chip" data-a="${v}">$${v}</button>`).join("")}</div>
   <input type="number" id="dAmt" min="1" max="${left}" step="1" placeholder="Например, 20" style="width:100%">
   <label>Промокод</label>
   <div style="display:flex;gap:8px"><input id="dPromo" placeholder="Введи промокод" autocomplete="off" style="flex:1;min-width:0;text-transform:uppercase"><button class="btn ghost sm" id="dApply">Применить</button></div>
   <div class="hint" id="dInfo" style="margin-top:10px;min-height:20px"></div>
   <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="dClose">Отмена</button><button class="btn green sm" id="dPay">Пополнить</button></div></div>`;
  $("#modal").classList.add("on");
  const calc=()=>{const a=Math.floor((+$("#dAmt").value||0)*100)/100,pct=promo?PROMOS[promo]:0;return{a,pct,got:Math.round(a*(1+pct/100)*100)/100}};
  const upd=()=>{const{a,pct,got}=calc();$("#dInfo").innerHTML=a>0?`К зачислению: <b style="color:var(--green)">${fmt(got)}</b>${pct?` (промокод ${promo}: +${pct}%)`:""}`:(promo?`Промокод ${promo} активен: +${pct}% к пополнению`:"")};
  $$(".chip[data-a]").forEach(b=>b.onclick=()=>{$("#dAmt").value=Math.min(+b.dataset.a,left);upd()});
  $("#dAmt").oninput=upd;
  $("#dApply").onclick=()=>{const c=$("#dPromo").value.trim().toUpperCase();if(!c){promo=null;upd();return toast("Введи промокод")}
    if(PROMOS[c]){promo=c;toast(`Промокод ${c}: +${PROMOS[c]}% к пополнению`)}else{promo=null;toast("Такого промокода нет")}upd()};
  $("#dClose").onclick=closeModal;
  $("#dPay").onclick=()=>{const{a,pct,got}=calc(),l=depLeft();
    if(l<=0)return toast("Дневной лимит пополнения исчерпан");
    if(a<1)return toast("Минимальная сумма — $1");
    if(a>l)return toast(`Лимит на сегодня: осталось ${fmt(l)}`);
    st.dep.s=Math.round((st.dep.s+a)*100)/100;st.bal+=got;save();closeModal();toast(`Баланс пополнен на ${fmt(got)}`+(pct?` (+${pct}%)`:""))};
}

/* ============ ОНЛАЙН И LIVE-ДРОПЫ (симуляция) ============ */
const NICKS=["Stolb","Shlyxa","Dima_X","Kirill77","Aigul","Nurs","Ernar","ProGamer","Sanya","Madi","Temir","Alina","Vlad","Bekzat","Dana","Artem","Zhanibek","LuckyBoy","Gena","Kostya","Roma","AWPer","Sveta","Dastan"];
const FEED=[];let online=0;
const onlineBase=()=>{const h=new Date().getHours()+new Date().getMinutes()/60;return Math.round(1100+500*(.5+.5*Math.sin((h-14)/24*2*Math.PI)))};
online=onlineBase()+Math.round((Math.random()-.5)*120);
function pushFeed(nick,d,c,fresh){
  FEED.unshift({nick,n:d.n,r:d.r,p:d.p,c:c.name,svg:skinSVG(d.n),fresh:!!fresh});
  if(FEED.length>14)FEED.pop();
  drawFeed(true);
}
function drawFeed(anim){
  const f=$("#feed");if(!f)return;
  f.innerHTML=FEED.map((d,i)=>`<div class="fd ${d.r} ${anim&&i===0&&d.fresh?"new":""}"><div class="fi">${d.svg}</div><b>${esc(d.nick)} · ${esc(d.c)}</b><span>${esc(d.n)}</span><em>${fmt(d.p)}</em></div>`).join("");
}
function botDrop(){
  const c=CASES[Math.floor(Math.random()*CASES.length)],d=fakeRoll(c);
  d.fresh=true;pushFeed(NICKS[Math.floor(Math.random()*NICKS.length)]+(Math.random()<.4?Math.floor(Math.random()*99):""),d,c,true);
}
for(let i=0;i<14;i++)botDrop();FEED.forEach(d=>d.fresh=false);
(function loop(){setTimeout(()=>{if(!document.hidden)botDrop();loop()},1800+Math.random()*2800)})();
setInterval(()=>{
  const b=onlineBase();online+=Math.round((Math.random()-.5)*14)+Math.sign(b-online)*2;
  online=Math.max(b-150,Math.min(b+150,online));
  const e=$("#onl");if(e)e.textContent=online.toLocaleString("ru-RU");
},3000);

/* ============ СОБЫТИЯ ============ */
$$("#nav button").forEach(b=>b.onclick=()=>{if(!busy)setView(b.dataset.v)});
$("#depBtn").onclick=openDeposit;
$("#modal").onclick=e=>{if(e.target.id==="modal"&&!busy)closeModal()};
render();
</script>
</body>
